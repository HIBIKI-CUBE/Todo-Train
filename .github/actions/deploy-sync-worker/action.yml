name: Deploy sync worker
description: Deploy sync/worker with an isolated Worker name (Durable Objects cannot use aliased preview URLs).

inputs:
  worker-name:
    description: Cloudflare Worker script name
    required: true
  api-token:
    description: Cloudflare API token
    required: true
  account-id:
    description: Cloudflare account ID
    required: true
  github-token:
    description: GITHUB_TOKEN for sticky PR comments
    required: true
  comment-pr:
    description: Post or update a sticky comment on the current PR
    required: false
    default: "false"
  deploy-command:
    description: Full wrangler command. Empty uses `deploy --name <worker-name>`.
    required: false
    default: ""
  public-url:
    description: Canonical HTTPS URL to report (custom domain). Empty uses workers.dev from the deploy log.
    required: false
    default: ""
  custom-domain:
    description: Hostname to attach as a Workers custom domain (no scheme). Empty skips. Used for per-PR hosts.
    required: false
    default: ""

outputs:
  deployment-url:
    description: Public URL for this Worker
    value: ${{ steps.url.outputs.url }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: sync/worker/package-lock.json

    - name: Attach custom domain
      if: ${{ inputs.custom-domain != '' }}
      shell: bash
      env:
        CUSTOM_DOMAIN: ${{ inputs.custom-domain }}
      run: |
        set -euo pipefail
        case "$CUSTOM_DOMAIN" in
          *[!A-Za-z0-9.-]*|"") echo "invalid custom domain: ${CUSTOM_DOMAIN}"; exit 1 ;;
        esac
        cat >> "${GITHUB_WORKSPACE}/sync/worker/wrangler.toml" <<EOF

[[routes]]
pattern = "${CUSTOM_DOMAIN}"
custom_domain = true
EOF

    - name: Deploy
      id: deploy
      uses: cloudflare/wrangler-action@v4
      env:
        WRANGLER_SEND_METRICS: "false"
      with:
        apiToken: ${{ inputs.api-token }}
        accountId: ${{ inputs.account-id }}
        workingDirectory: sync/worker
        packageManager: npm
        wranglerVersion: "4.129.1"
        gitHubToken: ${{ inputs.github-token }}
        command: ${{ inputs.deploy-command || format('deploy --name {0}', inputs.worker-name) }}

    - name: Resolve public URL
      id: url
      shell: bash
      env:
        PUBLIC_URL: ${{ inputs.public-url }}
        DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        CMD_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        WORKER_NAME: ${{ inputs.worker-name }}
      run: |
        set -euo pipefail
        url="${PUBLIC_URL:-}"
        if [ -z "$url" ]; then
          url="${DEPLOY_URL:-}"
        fi
        if [ -z "$url" ] || ! grep -Eq '^https://' <<<"$url"; then
          extracted="$(printf '%s\n' "$CMD_OUTPUT" | grep -Eo 'https://[A-Za-z0-9.-]+\.(workers\.dev|hibiki-cube\.dev)' | head -n1 || true)"
          if [ -n "$extracted" ]; then
            url="$extracted"
          fi
        fi
        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "Worker ${WORKER_NAME} → ${url:-<none>}"

    - name: Sticky PR comment
      if: ${{ inputs.comment-pr == 'true' }}
      uses: actions/github-script@v7
      env:
        DEPLOY_URL: ${{ steps.url.outputs.url }}
        WORKER_NAME: ${{ inputs.worker-name }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const marker = '<!-- todotrain-sync-preview -->';
          const url = process.env.DEPLOY_URL || '';
          const worker = process.env.WORKER_NAME;
          const fallback = worker.startsWith('todotrain-sync-pr-')
            ? `https://${worker.replace('todotrain-sync-pr-', 'pr-')}.todo-train.hibiki-cube.dev`
            : `https://${worker}.<account-subdomain>.workers.dev`;
          const urlLine = url
            ? `- URL: ${url}`
            : `- URL: \`${fallback}\`（ログから URL を取れなかった）`;
          const body = [
            marker,
            '### Sync worker preview',
            '',
            urlLine,
            `- Worker: \`${worker}\``,
            '',
            'Durable Objects は本番 / develop と別インスタンスです。この PR を閉じると Worker は削除されます。',
            '',
          ].join('\n');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find((c) => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
