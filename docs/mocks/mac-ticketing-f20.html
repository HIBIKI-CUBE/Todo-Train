<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mac ステージ #192（f20 発車のガイドレール：発券機に付いて動き、退場で引っ込む）</title>
<style>
*{box-sizing:border-box;transition:none!important;animation:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#bbb;font-family:-apple-system,"Hiragino Sans",sans-serif;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
:root{--amb:rgba(255,176,0,.85);--ambdim:rgba(255,176,0,.5);--leg:rgba(242,230,200,.55)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:#2a2c2e;padding-top:env(safe-area-inset-top);padding-bottom:max(env(safe-area-inset-bottom),6px)}

/* ───── 上半分：Mac のデスクトップ ───── */
#desk{flex:0 0 46%;position:relative;overflow:hidden;background:#26303b;border-bottom:2px solid #151617}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;font:13px/1.3 -apple-system,"Hiragino Sans",sans-serif;color:#e8e8ea}
#cursor{position:absolute;left:0;top:0;pointer-events:none;z-index:99;will-change:transform}
#cursor svg{display:block;overflow:visible}
#cursor.dn svg path{fill:#d8d8d8}

/* メニューバー */
#menubar{position:absolute;left:0;top:0;right:0;height:24px;background:#1c1d1f;display:flex;align-items:center;padding:0 8px;font-size:13px;z-index:60;border-bottom:1px solid #111}
#menubar .mi{padding:0 8px;height:20px;line-height:20px;border-radius:4px;white-space:nowrap}
#menubar .mi.b{font-weight:700}
#menubar .mi.hv{background:rgba(255,255,255,.12)}
#menubar .sp{flex:1}
#sicon{display:flex;align-items:center;gap:5px;padding:0 7px;height:20px;border-radius:4px;color:#f2f2f4}
#sicon.hv{background:rgba(255,255,255,.12)}#sicon.on{background:rgba(255,255,255,.24)}
#sicon svg{width:15px;height:15px;display:block}
#sicon .bt{font-variant-numeric:tabular-nums;font-size:12px}
#menubar .ic{width:16px;height:16px;margin:0 6px;display:block;color:#d6d6d8}
#menubar .clk{padding:0 8px;font-size:13px;white-space:nowrap}

/* ダミーの作業アプリ（エディタ） */
#win{position:absolute;left:46px;top:52px;width:520px;height:400px;background:#1e1f22;border-radius:10px;border:1px solid #3a3b3f;overflow:hidden;z-index:10;display:flex;flex-direction:column}
#wtitle{flex:none;height:28px;background:#2b2c30;display:flex;align-items:center;padding:0 10px;gap:8px;border-bottom:1px solid #141517}
#wtitle .dot{width:12px;height:12px;border-radius:50%;flex:none}
#wtitle .t{flex:1;text-align:center;font-size:12px;color:#a8a9ad;margin-right:52px;white-space:nowrap;overflow:hidden}
#wbody{position:relative;flex:1;min-height:0}
#code{position:absolute;inset:0;overflow:auto;font:12px/18px ui-monospace,"SF Mono",Menlo,monospace;scrollbar-width:none;cursor:default}
#code::-webkit-scrollbar{display:none}
#code .ln{display:flex;height:18px;white-space:pre}
#code .ln i{flex:none;width:40px;text-align:right;padding-right:10px;color:#5a5c62;font-style:normal;background:#1e1f22}
#code .ln.cur{background:#2a2c31}#code .ln.cur i{color:#a8a9ad}
#code .ln b{font-weight:400;position:relative}
#code .k{color:#c586c0}#code .s{color:#c9a26d}#code .c{color:#6a9955}#code .n{color:#7fbfd6}
#caret{position:absolute;width:2px;height:16px;background:#e8e8ea;pointer-events:none;display:none}
#thumb{position:absolute;right:2px;width:5px;border-radius:3px;background:rgba(255,255,255,.35);pointer-events:none}

/* PiP カード 320×128 */
#pip{position:absolute;left:0;top:0;width:320px;height:128px;background:#000;border-radius:16px;border:1px solid rgba(255,255,255,.12);z-index:20;color:#fff;overflow:hidden;display:none}
#pip .pt{position:absolute;left:12px;right:12px;top:10px;font:500 28px/34px ui-rounded,-apple-system,"Hiragino Sans",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:clip}
#pip .ps{position:absolute;left:12px;right:12px;top:48px;height:24px;font-size:15px;font-weight:600;line-height:24px;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden}
#pip .ps.over{color:rgba(210,96,84,.95);font-size:13px;font-weight:500}
#pip .bar{position:absolute;left:12px;right:12px;top:84px;height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
#pip .bar i{display:block;height:100%;background:rgba(255,255,255,.88);width:0}
#pip .bar.over i{background:rgba(210,96,84,.9)}
#pip .rem{position:absolute;left:12px;bottom:10px;font-size:15px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.9)}
#pip .rem.over{color:rgba(210,96,84,.95)}
#pip .pbtn{position:absolute;right:10px;bottom:8px;height:26px;padding:0 12px;border-radius:13px;background:rgba(255,255,255,.16);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;border:0;font-family:inherit}
#pip .pbtn.hv{background:rgba(255,255,255,.28)}#pip .pbtn.pd{background:rgba(255,255,255,.4)}
#pip.drag{border-color:rgba(255,255,255,.3)}

/* ポップオーバー */
#pop{position:absolute;width:280px;background:#2b2c2f;border:1px solid #46474b;border-radius:10px;z-index:70;padding:12px;display:none}
#pop::before{content:'';position:absolute;top:-6px;right:14px;width:10px;height:10px;background:#2b2c2f;border-left:1px solid #46474b;border-top:1px solid #46474b;transform:rotate(45deg)}
#pop .h{display:flex;align-items:baseline;gap:8px}
#pop .h b{font-size:13px}#pop .h span,#pop .cap{font-size:11px;color:#9a9ba0}
#pop .st{margin:10px 0 8px;font-size:13px;line-height:1.35}
#pop .st small{display:block;font-size:11px;color:#9a9ba0;font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;height:24px;margin:5px 0 0;border-radius:6px;border:1px solid #55565a;background:#3a3b3f;color:#f0f0f2;font:13px -apple-system,"Hiragino Sans",sans-serif;text-align:center;line-height:22px;padding:0}
.btn.hv{background:#46474c}.btn.pd{background:#303135}
.btn.pri{background:#0a6cf0;border-color:#0a6cf0;color:#fff}.btn.pri.hv{background:#2a80f5}.btn.pri.pd{background:#085bcc}
.btn.dis{opacity:.4}
#pop hr{border:0;border-top:1px solid #46474b;margin:10px 0 4px}
#pop .row{height:22px;line-height:22px;padding:0 6px;border-radius:4px;font-size:13px}#pop .row.hv{background:#0a6cf0;color:#fff}

/* いまやる パネル（ダミー） */
#panel{position:absolute;left:0;top:0;width:400px;background:#2b2c2f;border:1px solid #46474b;border-radius:12px;z-index:65;display:none;overflow:hidden}
#panel .pth{height:28px;background:#333438;display:flex;align-items:center;padding:0 10px;gap:8px;border-bottom:1px solid #141517;font-size:13px;font-weight:600}
#panel .pth .x{width:12px;height:12px;border-radius:50%;background:#ff5f57}
#panel .pth span{flex:1;text-align:center;margin-right:20px}
#panel .pbd{padding:20px;display:flex;flex-direction:column;gap:14px}
#panel .fld{height:28px;border-radius:6px;background:#1c1d1f;border:1px solid #55565a;padding:0 8px;line-height:26px;font-size:13px}
#panel .lab{font-size:12px;color:#9a9ba0;margin-bottom:6px}
#panel .seg{display:flex;border:1px solid #55565a;border-radius:6px;overflow:hidden}
#panel .seg div{flex:1;height:24px;line-height:22px;text-align:center;font-size:13px;border-left:1px solid #55565a;background:#3a3b3f}
#panel .seg div:first-child{border-left:0}#panel .seg div.hv{background:#46474c}#panel .seg div.on{background:#0a6cf0;color:#fff}
#panel .btns{display:flex;gap:8px;justify-content:flex-end}#panel .btns .btn{width:auto;min-width:76px;padding:0 14px;margin:0}

/* 右クリックメニュー */
#ctx{position:absolute;min-width:150px;background:#2b2c2f;border:1px solid #46474b;border-radius:8px;padding:4px;z-index:80;display:none}
#ctx div{height:22px;line-height:22px;padding:0 10px;border-radius:4px;font-size:13px}#ctx div.hv{background:#0a6cf0;color:#fff}#ctx hr{border:0;border-top:1px solid #46474b;margin:4px 0}

/* ───── 下半分：トラックパッドとキー ───── */
#strip{flex:none;height:28px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:11px;color:var(--leg);letter-spacing:.08em;background:#2a2c2e}
#strip .nm{color:rgba(242,230,200,.7)}
#chip{flex:1;text-align:right;color:var(--amb);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums;min-height:14px}
#gear{flex:none;height:22px;padding:0 10px;border-radius:2px;background:#2e3033;box-shadow:0 2px 0 #1d1e20;color:rgba(242,230,200,.7);font-size:11px;letter-spacing:.12em;line-height:22px}
#gear.on{box-shadow:none;transform:translateY(1px);color:var(--amb)}
#padwrap{flex:1;min-height:0;padding:0 8px 8px}
#pad{position:relative;width:100%;height:100%;background:#3F4245;border-radius:14px;box-shadow:inset 1px 1px 0 #4c5054,inset 0 0 0 2px #2e3033;overflow:hidden}
#pad .hint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:10px;letter-spacing:.3em;color:rgba(242,230,200,.22);pointer-events:none}
#pz{position:absolute;left:0;right:0;bottom:0;height:34px;border-top:1px dashed rgba(242,230,200,.22);display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:.3em;color:rgba(242,230,200,.3);pointer-events:none}
#pz.off{display:none}
#pz.on{background:rgba(255,176,0,.14);color:var(--amb)}
.fdot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:1px solid rgba(242,230,200,.55);pointer-events:none;display:none}
#keys{flex:none;padding:0 8px;display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.kr{display:flex;gap:4px}
.kk{flex:1;height:34px;min-width:0;background:#2e3033;border-radius:3px;box-shadow:0 2px 0 #1d1e20;display:flex;align-items:center;justify-content:center;font-size:14px;color:rgba(242,230,200,.75);position:relative}
.kk.sm{font-size:11px;letter-spacing:.04em}
.kk.sep{margin-left:6px}
.kk.wide{flex:2.4;font-size:11px;letter-spacing:.06em}
.kk.on{box-shadow:none;transform:translateY(2px);background:#5a4210;color:var(--amb)}
.kk.dn{box-shadow:none;transform:translateY(2px);background:#3a3d40}

/* ───── 調整（設定画面）───── */
#settings{position:fixed;inset:0;background:#0d0d0d;z-index:200;display:none;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:max(env(safe-area-inset-top),14px) 16px max(env(safe-area-inset-bottom),24px);font-size:14px;-webkit-user-select:auto;user-select:auto}
#settings h2{font-size:15px;margin:6px 0 4px;color:#ddd;display:flex;align-items:center;justify-content:space-between}
#settings h3{font-size:12px;letter-spacing:.1em;color:var(--ambdim);margin:20px 0 4px;font-weight:600}
#settings label{display:block;margin:12px 0}
#settings label>span.v{color:var(--amb);float:right;font-variant-numeric:tabular-nums}
#settings input[type=range]{width:100%;margin:6px 0 0}
#settings input[type=checkbox]{margin-right:8px;transform:scale(1.2)}
#settings select,#settings button{background:#222;color:#ddd;border:1px solid #444;padding:8px 10px;border-radius:6px;font-size:14px;max-width:100%}
#settings select{width:100%;margin-top:6px}
#settings p.note{color:#777;font-size:11px;margin:4px 0}

/* ───── #192 切符だけ発行（v9.1：枠なしのパイ）───── */
.otl{color:#fff;font-weight:700;text-shadow:-1px -1px 0 #111,1px -1px 0 #111,-1px 1px 0 #111,1px 1px 0 #111,0 -1px 0 #111,0 1px 0 #111,-1px 0 0 #111,1px 0 0 #111;white-space:nowrap;pointer-events:none}
#pieCatch{position:absolute;inset:0;z-index:88;display:none}
#pie{position:absolute;left:0;top:0;width:0;height:0;z-index:89;display:none;pointer-events:none}
#pie svg{position:absolute;overflow:visible}
#pie .pl{position:absolute;font-size:17px;transform:translate(-50%,-50%)}
#mt{position:absolute;left:0;top:0;width:425px;height:288px;z-index:90;display:none;pointer-events:none;transform-origin:50% 50%;will-change:transform;backface-visibility:hidden}
#mt.fly{z-index:91}
.mtf{position:relative;width:425px;height:288px;border-radius:2.5px;overflow:hidden;background:#D5E6EA;border:.5px solid rgba(26,26,26,.18);color:#1a1a1a;font-family:-apple-system,"Hiragino Sans",sans-serif}
.mtf .pat{position:absolute;inset:0;opacity:.08}
.mtf .band{position:absolute;left:0;right:0;top:28%;height:34%;background:#E7F1F3}
.mtf .trk{position:absolute;left:10px;top:10px;width:391px;height:6.5px;display:flex;gap:1.5px}
.mtf .trk i{flex:1;border:.5px solid rgba(26,26,26,.22);border-radius:.7px;position:relative;overflow:hidden}
.mtf .trk i b{position:absolute;left:0;top:0;bottom:0;background:#1a1a1a}
.mtf .prt{position:absolute;inset:0;clip-path:inset(0 0 100% 0)}
.mtf .ttl{position:absolute;left:10px;top:28px;width:300px;font-size:22px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mtf .fare{position:absolute;right:28px;top:26px;display:flex;align-items:baseline;gap:1px}
.mtf .fare b{font-size:28px;font-weight:700;letter-spacing:-.6px;font-variant-numeric:tabular-nums}.mtf .fare span{font-size:11px;font-weight:600}
.mtf .val{position:absolute;left:10px;top:100px;font-size:11px;white-space:nowrap}.mtf .val b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.mtf .ft{position:absolute;left:10px;bottom:10px;font-size:9px;opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap}
.mtf .ser{position:absolute;right:-30px;top:50%;font-size:9px;color:#7A3D8A;white-space:nowrap;transform:translateY(-50%) rotate(90deg);font-variant-numeric:tabular-nums}
#ptext{position:absolute;z-index:92;font-size:17px;transform:translate(-50%,-100%);display:none;text-align:center;line-height:1.35}
#ptext .tt{max-width:300px;overflow:hidden;text-overflow:clip;display:inline-block;vertical-align:bottom}
#ptext .ph{opacity:.6}#ptext small{display:block;font-size:11px;font-weight:600;opacity:.8}
#toast{position:absolute;z-index:93;font-size:15px;display:none;transform:translateX(-100%)}
#sicon.pend::after{content:'';width:5px;height:5px;border-radius:50%;background:#fff;margin-left:-2px;margin-top:-9px;display:block}
#tbar{position:absolute;left:0;height:28px;right:72px;padding:0 8px;display:none;z-index:50;background:#2a2c2e;align-items:center}
#tbar input{width:100%;height:26px;border-radius:4px;border:1px solid #55565a;background:#151617;color:#f0e6c8;font-size:16px;padding:0 8px;font-family:inherit;-webkit-user-select:text;user-select:text;outline:none}
#tbar input:focus{border-color:var(--ambdim)}
#settings .rd{background:#151617;border:1px solid #2a2c2e;border-radius:6px;padding:8px 10px;font-size:12px;color:#aaa;line-height:1.6;margin:8px 0}

/* ───── f1：縦なでで所要、横に流して離して確定。押せそうな部品は置かない ───── */
#card{position:absolute;left:0;top:0;z-index:87;display:none;pointer-events:none;font-family:-apple-system,"Hiragino Sans",sans-serif}
#scrim{position:absolute;inset:0;background:#000;opacity:.35;z-index:85;display:none;pointer-events:none}
#mouth{position:absolute;left:0;right:0;bottom:0;height:3px;background:#fff;opacity:.45;z-index:92;display:none;pointer-events:none}
#pz{display:none!important}
.dc{width:393px;position:relative}
.dc .led{display:block;margin:0 0 10px;transition:opacity .12s}
.dc .cap{position:absolute;left:0;right:0;top:0;height:80px;display:flex;align-items:center;padding-left:26px;font:600 26px/1 -apple-system,"Hiragino Sans",sans-serif;letter-spacing:.28em;color:#fff;opacity:0;transition:opacity .12s;white-space:nowrap;background:#0a0e0d;border:1px solid #2c2c2e;border-radius:10px;box-sizing:border-box}
.dc.svarm .cap{opacity:1}
.dc .sh{background:#000;border:1px solid #2c2c2e;border-radius:22px;overflow:hidden;color:#fff;will-change:transform}
.dc .nv{height:44px;line-height:44px;text-align:center;font-size:17px;font-weight:600}
.dc .tz{margin:22px 20px 0;background:#1c1c1e;border-radius:10px;padding:20px 12px;font-size:17px;line-height:22px;white-space:nowrap;overflow:hidden}
.dc .rl{margin-top:20px;background:#1c1c1e;padding:12px 20px 14px;display:grid;grid-template-columns:1fr auto;align-items:center}
.dc .num{display:flex;align-items:baseline;gap:4px}
.dc .num b{display:inline-block;font:500 56px/64px ui-rounded,-apple-system,"Hiragino Sans",sans-serif;font-variant-numeric:tabular-nums;min-width:68px}
.dc .num span{font-size:20px;font-weight:600;color:#8e8e93}
.dc .vg{position:relative;width:10px;height:72px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden}
.dc .vf{position:absolute;left:0;right:0;bottom:0;height:10px;border-radius:5px;background:#0a6cf0}
.dc .fn{grid-column:1/3;margin-top:10px;min-height:32px;font-size:12px;color:#8e8e93}
.dc.svarm .fn,.dc.dparm .fn{color:#fff}

/* ───── f2：離す前なら取り消せる。横の溜まり・待機・引き返しを、看板とシートの動きで見せる（部品は置かない） ───── */
.dc .led,.dc .cap{transition:none}
.dc .cap{gap:.12em}
.dc .cap .chv{display:inline-flex;gap:0;margin-right:.35em}
.dc .cap .chv i{font-style:normal;opacity:.5}
.dc.svarm .cap .chv i{animation:chv .9s infinite}
.dc.svarm .cap .chv i:nth-child(2){animation-delay:.15s}
.dc.svarm .cap .chv i:nth-child(3){animation-delay:.3s}
@keyframes chv{0%,65%{opacity:1}80%,100%{opacity:.2}}

/* ───── f4：操作の前から左右の行き先が読める静的な手がかり。押せそうな部品・光・質感は置かない ───── */
.dc .sl{position:absolute;pointer-events:none}
.dc .sl{top:0;width:14px;height:0;box-sizing:border-box;background:#000;border:1.5px solid #636366}
.dc .sl-r{right:1px;border-right:none;border-radius:4px 0 0 4px;border-color:rgba(115,158,199,.8)}
.dc .sl-l{left:1px;border-left:none;border-radius:0 4px 4px 0;border-color:rgba(255,184,71,.7)}
.dc.rc .sl-r{border-right:1.5px solid #636366;border-radius:3px;background:repeating-linear-gradient(0deg,#636366 0 2px,#000 2px 5px)}
.stub{position:absolute;left:0;top:0;width:425px;height:288px;pointer-events:none;transform-origin:50% 50%}

/* ───── f6：スリットの中だけで左右の性格を分ける。シートの外には何も描かない ───── */
.dc .sl svg{position:absolute;top:50%;margin-top:-12px;pointer-events:none;overflow:visible}
.dc .sl-r svg{left:0}.dc .sl-l svg{right:0}
.dc .sl-r svg line{stroke:#739EC7;stroke-width:1.4;stroke-linecap:butt;opacity:.85}
.dc .sl-l svg line{stroke:#FFB847;stroke-width:1.4;opacity:.8}
.dc .sl-l svg rect{fill:#FFB847;opacity:.85}
.dc.rc .sl-r svg .out{display:none}
.dc.rc .sl-r svg line{stroke:#8E8E93;opacity:.6}

/* ───── f8：口の形は固定。ふちに LED のドットを 1 列。点く／消えるの 2 値（にじみ・ぼかし・グローなし） ───── */
.dc .sl .tr,.dc .sl .br{position:absolute;width:3px;pointer-events:none}
.dc .sl-r .tr,.dc .sl-r .br{right:1px}.dc .sl-l .tr,.dc .sl-l .br{left:1px}
.dc .sl-r .tr,.dc .sl-r .br{background:#739EC7}.dc .sl-l .tr,.dc .sl-l .br{background:#FFB847}
.dc .sl .tr{top:4px;bottom:4px;opacity:.14}
.dc .sl .br{top:50%;height:0;opacity:1}.dc .sl .br.off{opacity:.2}
.dc.rc .sl-r .tr,.dc.rc .sl-r .br{display:none}
/* 空中のシェブロン（電光掲示板と同じ ドット 5×7）。押せない・文字なし */

const $=(s,r=document)=>r.querySelector(s);
const EL=Object.fromEntries(['desk','stage','cursor','menubar','sicon','bartitle','mclk','win','wtitle','code','caret','thumb','pip','panel','pfld','pseg','pcancel','pgo','pop','popst','popima','poppause','ctx','strip','chip','gear','pad','pz','kr1','kr2','settings','sbody','sclose','sreset','pieCatch','pie','mt','card','toast'].map(i=>[i,document.getElementById(i)]));

/* ═════ 座標とレイアウト ═════ */
let scale=1,LW=820,LH=600,deskRect=null;
function layout(){
 deskRect=EL.desk.getBoundingClientRect();
 LW=S.deskW;scale=deskRect.width/LW;LH=deskRect.height/scale;
 Object.assign(EL.stage.style,{width:LW+'px',height:LH+'px',transform:`scale(${scale})`});
 const k=S.curPx/19/1; EL.cursor.firstElementChild.style.transform=`scale(${k})`;EL.cursor.firstElementChild.style.transformOrigin='0 0';
 EL.win.style.left=Math.min(Math.max(0,winX),LW-120)+'px';
 clampWin();parkPip(false);placePop();placePanel();setCursor(cx,cy,true);
}
let winX=46,winY=52;
function clampWin(){const w=EL.win;winX=Math.min(Math.max(-w.offsetWidth+120,winX),LW-120);winY=Math.min(Math.max(24,winY),LH-40);w.style.left=winX+'px';w.style.top=winY+'px'}
/* 窓の大きさは画面に合わせて決める */
function fitWin(){const w=Math.min(520,LW-70),h=Math.min(400,LH-110);EL.win.style.width=w+'px';EL.win.style.height=h+'px'}

/* ═════ クリック音（WebAudio で合成。ファイルなし）═════
   押した瞬間＝締まった「カチッ」、離した瞬間＝やわらかい「コッ」。
   iPhone の Safari は振動できないので、音で触覚の代わりにする。マナーモードでは鳴らない（Web からは避けられない）。 */
let AC=null,NB=null;
function unlockAudio(){
 try{
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
   const n=AC.sampleRate*.05,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;NB=b;}
  if(AC.state!=='running')AC.resume();
  const o=AC.createBufferSource();o.buffer=AC.createBuffer(1,1,AC.sampleRate);o.connect(AC.destination);o.start(0);   // iOS 用の無音の一拍
 }catch(e){}
}
const STR={light:{g:.7,f:1.2,th:.55,dec:.8},mid:{g:.9,f:1,th:.85,dec:1},firm:{g:1.1,f:.82,th:1.2,dec:1.25}};
const sndLog={press:0,release:0};
function clickSound(kind,delay){
 sndLog[kind]++;
 if(!S.snd||!AC||AC.state==='suspended'||S.vol<=0)return;
 const st=STR[S.sndStr]||STR.mid,t=AC.currentTime+(delay||0),press=kind==='press';
 const vol=Math.pow(S.vol/100,1.6)*st.g*(press?1:.5);
 const out=AC.createGain();out.gain.value=vol;out.connect(AC.destination);
 // 高い側：短いノイズ
 const ns=AC.createBufferSource();ns.buffer=NB;
 const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=(press?2400:3400)*st.f;bp.Q.value=press?.9:.7;
 const ng=AC.createGain(),nd=(press?.010:.006)*st.dec;
 ng.gain.setValueAtTime(press?1:.8,t);ng.gain.exponentialRampToValueAtTime(.001,t+nd);
 ns.connect(bp).connect(ng).connect(out);ns.start(t);ns.stop(t+nd+.01);
 // 低い側：胴鳴りの小さな一拍
 const o=AC.createOscillator(),og=AC.createGain(),od=(press?.030:.020)*st.dec;
 o.type='sine';o.frequency.setValueAtTime((press?190:260)*st.f,t);o.frequency.exponentialRampToValueAtTime((press?85:150)*st.f,t+od);
 og.gain.setValueAtTime((press?.9:.45)*st.th,t);og.gain.exponentialRampToValueAtTime(.001,t+od);
 o.connect(og).connect(out);o.start(t);o.stop(t+od+.01);
}
function previewClick(){unlockAudio();clickSound('press',0);clickSound('release',.09)}
document.addEventListener('touchstart',unlockAudio,{passive:true,capture:true});
document.addEventListener('touchend',unlockAudio,{passive:true,capture:true});
document.addEventListener('mousedown',e=>{if(e.isTrusted)unlockAudio()},true);


/* ═════ カーソルと合成イベント ═════ */
let cx=300,cy=200,mods={meta:false,alt:false,ctrl:false,shift:false},down=null,lastClick={t:0,x:0,y:0,n:0},hoverChain=[],pressChain=[];
const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);
function setCursor(x,y,quiet){
 cx=clamp(x,0,LW-1);cy=clamp(y,0,LH-1);
 EL.cursor.style.transform=`translate(${cx*scale}px,${cy*scale}px)`;
 if(!quiet)moveEvents();
}
const clientPt=()=>[deskRect.left+cx*scale,deskRect.top+cy*scale];
function under(){const [x,y]=clientPt();return document.elementFromPoint(x,y)||EL.stage}
function mEvt(type,target,btn,extra){
 const [x,y]=clientPt();
 const o=Object.assign({bubbles:true,cancelable:true,view:window,clientX:x,clientY:y,screenX:x,screenY:y,button:btn||0,buttons:down?(down.btn===2?2:1):0,
  metaKey:mods.meta,altKey:mods.alt,ctrlKey:mods.ctrl,shiftKey:mods.shift,detail:1},extra||{});
 const ev=new MouseEvent(type,o);target.dispatchEvent(ev);return ev;
}
function pEvt(type,target,btn){
 const [x,y]=clientPt();
 target.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,view:window,clientX:x,clientY:y,pointerId:1,pointerType:'mouse',isPrimary:true,button:btn||0,buttons:down?1:0,metaKey:mods.meta,altKey:mods.alt,ctrlKey:mods.ctrl,shiftKey:mods.shift}));
}
function setHover(t){
 const chain=[];for(let e=t;e&&e!==EL.stage;e=e.parentElement)chain.push(e);
 hoverChain.forEach(e=>{if(!chain.includes(e))e.classList.remove('hv')});
 chain.forEach(e=>e.classList.add('hv'));hoverChain=chain;
}
function moveEvents(){
 const t=under();
 if(!down)setHover(t);
 pEvt('pointermove',t);mEvt('mousemove',t);
}
function mouseDown(btn=0){
 if(down)return;const t=under();
 down={btn,target:t,x:cx,y:cy,t:performance.now()};clickSound('press');
 pressChain=[];for(let e=t;e&&e!==EL.stage;e=e.parentElement){e.classList.add('pd');pressChain.push(e)}
 EL.cursor.classList.add('dn');
 pEvt('pointerdown',t,btn);mEvt('mousedown',t,btn);
 const f=t.closest('input,textarea,[tabindex]');if(f)f.focus();
}
function mouseUp(){
 if(!down)return;const d=down,t=under();
 pEvt('pointerup',t,d.btn);mEvt('mouseup',t,d.btn);
 clickSound('release');down=null;pressChain.forEach(e=>e.classList.remove('pd'));pressChain=[];EL.cursor.classList.remove('dn');
 if(d.btn===0){
  const same=d.target===t||d.target.contains(t)||t.contains(d.target);
  if(same){
   const tgt=d.target.contains(t)?d.target:t,now=performance.now();
   const near=Math.hypot(cx-lastClick.x,cy-lastClick.y)<8&&now-lastClick.t<S.dbl;
   lastClick={t:now,x:cx,y:cy,n:near?lastClick.n+1:1};
   mEvt('click',tgt,0,{detail:lastClick.n});
   if(lastClick.n===2){mEvt('dblclick',tgt,0,{detail:2});chip('ダブルクリック')}
  }
 }
 setHover(under());
 if(S.mod==='once')clearMods();
}
function click(){mouseDown(0);setTimeout(mouseUp,45);chip('クリック')}
function rightClick(){
 const t=under();const was=down;down={btn:2,target:t};
 clickSound('press');clickSound('release',.045);
 mEvt('mousedown',t,2);mEvt('contextmenu',t,2,{buttons:2});mEvt('mouseup',t,2);
 down=was;chip('右クリック');if(S.mod==='once')clearMods();
}

/* ═════ スクロール（wheel を作ってカーソル下に送る）═════ */
function scrollable(el,dx,dy){
 for(let e=el;e&&e!==EL.stage;e=e.parentElement){
  if(!e.classList.contains('scr'))continue;
  if(dy&&e.scrollHeight>e.clientHeight+1)return e;
  if(dx&&e.scrollWidth>e.clientWidth+1)return e;
 }return null;
}
function wheel(dx,dy,phase){

 for(let i=1;i<c.length;i++)if(v<=c[i][0]){const [v0,g0]=c[i-1],[v1,g1]=c[i];g=g0+(g1-g0)*(v-v0)/(v1-v0);break}

 const ev=U.ev={D,t:performance.now(),tw,th,LW,x0,y0,dest,Tm,Tt,pm,pt:pw,tm,Mtot,tU,te0,Tin,kT,T1,pe,Td,tR,Te,pw,Hx,Dr,Lp,dir,kind,tpo0,tpi0,endTau,pipTo:toSlot,chevLead:S.chevLead};

 if(dir>0&&!closedNow())U.chev={rel:true,ex:0,fd:0,now:performance.now()};

 let tk=EL.mt,T0=null,lastStep=-1,flightRes;const f={};
 cmd.flightDone=new Promise(r=>flightRes=r);
 return new Promise(done=>{
 const frame=now=>{

  if(!f.b0){f.b0=1;U.rT[side]=1;U.barForce[side]='on';setM(0);ev.feedStart=T0;placeTk(EL.mt,x0,y0);EL.mt.style.display='block';if(!quiet)haptic('level');tone(82,82,tU/tm/1000,.3,'sawtooth')}
  if(t>=30&&!f.b1){f.b1=1;U.barForce[side]='off';barClick(side,false,9)}
  if(t>=30+B&&!f.b2){f.b2=1;U.barForce[side]='on';barClick(side,true,9)}
  const M=Mfn(tau),sp_=Sp(tau);

   setM(M);setPrint(EL.mt,clamp((M+sp_)/D,0,1));
   if(tau<tU&&S.feedStep>0){const st=Math.floor((M+sp_)/S.feedStep);if(st!==lastStep){lastStep=st;if(S.chSnd>0)tone(2400,0,.006,S.chSnd/100*.22,'square')}}   // ローラー音（音だけ）
  }
  if(tau>=tU&&!f.fe){f.fe=1;ev.feedEnd=T0+tU/tm;EL.mt.style.zIndex=90;setPrint(EL.mt,1)}
  if(tau>=T1*.82&&!f.pr){f.pr=1;ev.presentStart=T0+T1/tm;tone(150,90,.05,.26,'triangle');haptic('align')}   // 見せる一瞬のはじまり（音と触感はここ）
  if(tau>=tR&&!f.px){f.px=1;ev.presentEnd=T0+tR/tm}
  if(tau>=tR&&!f.sw){                                                          // きっぷが出ていくところから、複製に持ち替える（見た目は同じ。メニューバーの下を通る）
   f.sw=1;const fl=EL.mt.cloneNode(true);fl.removeAttribute('id');fl.classList.add('fly');EL.stage.appendChild(fl);
   setPrint(fl,1);fl.style.zIndex=kind==='depart'?91:59;EL.mt.style.display='none';tk=fl;
  }
  if(tau>=Tm&&!f.me){                                                          // 発券機が画面の外へ出きった
   f.me=1;ev.machineEnd=T0+Tm/tm;setM(Mtot);
   if(kind==='depart'){closePieKeep();fadeCursorIn()}
  }
  placeTk(tk,tkX(tau),tkY(tau));
  if(kind!=='depart'&&f.me){                                                   // 保存：次の発券機が戻る
   if(tau>=te0&&!f.e0){f.e0=1;ev.enterStart=T0+te0/tm;P.title=nextTitle();P.sel='sv';P.idx=STOPS.indexOf(30);P.touched=true;buildCard();updateCard();placeCard();setM(Mtot)}
   if(f.e0){const u=clamp((tau-te0)/Tin,0,1);setM(Mtot*Math.pow(1-u,3));if(u>=1&&!f.en){f.en=1;ev.enterEnd=T0+(te0+Tin)/tm;card.style.transform='';P.lock=false}}
  }
  if(U.chev){U.chev.ex=0;U.chev.tau=tau;U.chev.st=tau<T1?1:tau<tR?2:3;U.chev.k=clamp(tau/T1,0,1);U.chev.mx=-dir*M;U.chev.ret=smoother(clamp((tau-T1)/((Tm-T1)*.9),0,1));U.chev.tkx=tkX(tau);U.chev.tw=tw;U.chev.front=Math.pow(Bfn(tau),.45);U.chev.fd=0;U.chev.now=now;updateChev(0,g,th,false)}

  if(toSlot&&tau>=tpi0&&!f.pi){f.pi=1;cmd.gone=true;if(cmd.state==='done')finishDepart(cmd,true)}

/* iPhone へ送る／ack */
function sendCmd(kind,title,min){
 if(IP.queue.length>=8){sndNo();return null}
 const cmd={id:'cmd-'+String(++sendCmd.n).padStart(3,'0'),kind,title,min,state:'queued',sent:0};
 IP.queue.push(cmd);
 renderPop();pump();refreshReadout();return cmd;
}
sendCmd.n=0;
function pump(){
 let i=0;
 IP.queue.forEach(cmd=>{
  if(cmd.state!=='queued'||!IP.front)return;
  cmd.state='inflight';cmd.sent++;
  setTimeout(()=>ack(cmd),S.ackMs+(i++)*350);
 });
}
function ack(cmd){
 if(!IP.front){cmd.state='queued';return}                     // 途中で閉じたら列で待つ（再送はしない）
 if(IP.delivered.has(cmd.id)){IP.dupes++;refreshReadout();return}   // cmd の ID で重複を除く
 IP.delivered.add(cmd.id);IP.recv++;
 IP.queue=IP.queue.filter(c=>c!==cmd);cmd.state='done';
 IP.hub.push({id:cmd.id,title:cmd.title,min:cmd.min,st:cmd.kind==='depart'?'乗車中':'在庫'});
 renderPop();refreshReadout();
 if(cmd.kind==='depart'){ if(cmd.slot){if(cmd.gone)finishDepart(cmd,true)} else enterDepart(cmd) }
}
/* 発車の ack：きっぷは PiP の位置でひと息おいてから、乗務の PiP に替わる */
function pipOutAnim(){                                                        // いまの PiP は、きっぷが出ていくのに合わせて横へ出てから消える（急に消えない）
 if(EL.pip.style.display==='none'){pipSuppress=true;return}
 const sd=pipX+160>LW/2?1:-1,t0=performance.now(),ms=Math.max(60,S.pipInMs*.55);
 const st=n=>{const k=Math.min(1,(n-t0)/ms);pipOff=sd*56*k*k;EL.pip.style.opacity=(1-k).toFixed(3);placePip();if(k<1)requestAnimationFrame(st);else{pipSuppress=true;renderPip();pipOff=0;EL.pip.style.opacity='';placePip()}};
 requestAnimationFrame(st)}
async function finishDepart(cmd,anim){
 if(cmd.finishing)return;cmd.finishing=true;
 if(!anim)await wait(60);
 RIDE.title=cmd.title;RIDE.total=cmd.min*60;RIDE.el=0;RIDE.run=true;pipMode='ride';
 pipSuppress=false;
 if(anim){const sd=pipX+160>LW/2?1:-1,o0=sd*56;pipOff=o0;EL.pip.style.opacity=0;renderPip();placePip();   // きっぷが出ていくのと重なって、横から入る（減速。きっぷの曲線と同じ族の 3 乗）
  const t0=performance.now(),ms=Math.max(60,S.pipInMs/Math.max(.3,S.tempo));
  const st=n=>{const k=Math.min(1,(n-t0)/ms),e=1-Math.pow(1-k,3);pipOff=o0*(1-e);EL.pip.style.opacity=Math.min(1,k*2.2).toFixed(3);placePip();if(k<1)requestAnimationFrame(st);else{pipOff=0;EL.pip.style.opacity='';placePip()}};
  requestAnimationFrame(st)}
 else renderPip();
 syncPipSel();
 if(cmd.ticketEl){cmd.ticketEl.remove();cmd.ticketEl=null}
 chip('発車');
}
async function enterDepart(cmd){          // 閉じていたあいだに送った発車：ack が来てからきっぷが横から滑り込む
 if(cmd.finishing)return;
 if(cmd.flightDone)await cmd.flightDone;
 if(cmd.ticketEl){finishDepart(cmd);return}
 pipSuppress=true;renderPip();
 const fl=EL.mt.cloneNode(true);fl.removeAttribute('id');fl.classList.add('fly');EL.stage.appendChild(fl);
 fillTicket(fl,cmd.title,cmd.min);setPrint(fl,1);const sc=320/425;fl.dataset.sp='';sizeTk(fl,sc);fl.style.display='block';
 const pc=[pipX+160,pipY+64],left=pc[0]<LW/2,x0=left?-(212.5*sc)-12:LW+212.5*sc+12;
 await tween(420,t=>placeTk(fl,x0+(pc[0]-x0)*t,pc[1]));
 cmd.ticketEl=fl;finishDepart(cmd);
}
let toastT=null;

 const [ix,iy]=iconPos();
 EL.toast.textContent=msg;EL.toast.style.display='block';EL.toast.style.left=(ix+12)+'px';EL.toast.style.top=(MENU+8)+'px';

function setFront(v){
 IP.front=v;

}
function refreshReadout(){
 const el=document.getElementById('xRead');if(!el)return;
 const hub=IP.hub.length?IP.hub.map(h=>`・${h.title.replace(/</g,'&lt;')}　${h.min}分　${h.st}`).join('<br>'):'（なし）';

}
